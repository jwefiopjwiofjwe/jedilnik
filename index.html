<!DOCTYPE html>
<html lang="sl"><head><meta charset="utf-8"><title>Jedilnik iz računa (demo)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eaf2ee;--card:#fff;--ink:#12231b;--mute:#62786d;--line:#d4e2da;--g:#13a05f;--g2:#0b7a47;--gs:#d8f3e5;--y:#f7c948;--ys:#fff0bd;--r:#e5484d;--rs:#fde4e4;--sh:0 14px 34px rgba(18,35,27,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1612;--card:#15251e;--ink:#e9f5ee;--mute:#92ab9e;--line:#25392f;--gs:#173b2a;--ys:#4a3f12;--rs:#4a1f22;--sh:0 14px 34px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0b1612;--card:#15251e;--ink:#e9f5ee;--mute:#92ab9e;--line:#25392f;--gs:#173b2a;--ys:#4a3f12;--rs:#4a1f22;--sh:0 14px 34px rgba(0,0,0,.5)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;min-height:100%}
main{max-width:480px;margin:0 auto;padding:14px 16px 32px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}.logo{font:800 20px "Avenir Next","Segoe UI",system-ui,sans-serif;letter-spacing:-.3px}.logo i{font-style:normal;background:var(--g);color:#fff;border-radius:10px;padding:2px 8px;margin-right:6px}
.dots{display:flex;gap:6px}.dots b{width:26px;height:6px;border-radius:3px;background:var(--line)}.dots b.on{background:var(--g)}
h1{font:800 28px/1.12 "Avenir Next","Segoe UI",system-ui,sans-serif;margin:0 0 6px;letter-spacing:-.5px}h2{font-size:20px;margin:0 0 4px}p{margin:0 0 12px;color:var(--mute)}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.btn{display:block;width:100%;border:0;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;font:700 17px inherit;font-family:inherit;padding:15px;border-radius:14px;margin-top:10px;box-shadow:0 8px 18px rgba(19,160,95,.35)}.btn.alt{background:transparent;color:var(--g);border:2px solid var(--g);box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.receipt{background:#fff;color:#222;font:14px/1.75 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:16px 14px 24px;border-radius:6px;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),95% 100%,90% calc(100% - 8px),85% 100%,80% calc(100% - 8px),75% 100%,70% calc(100% - 8px),65% 100%,60% calc(100% - 8px),55% 100%,50% calc(100% - 8px),45% 100%,40% calc(100% - 8px),35% 100%,30% calc(100% - 8px),25% 100%,20% calc(100% - 8px),15% 100%,10% calc(100% - 8px),5% 100%,0 calc(100% - 8px))}
.ln{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed #ccc}.ln.new{animation:in .3s both}@keyframes in{from{opacity:0;transform:translateY(4px)}}
.tag{font:700 12px inherit;font-family:inherit;border-radius:8px;padding:2px 8px;white-space:nowrap;background:var(--gs);color:var(--g)}.tag.y{background:var(--ys);color:#8a6a00}.tag.r{background:var(--rs);color:var(--r)}
@media(prefers-color-scheme:dark){.tag.y{color:var(--y)}}
.m{border-top:1px solid var(--line);padding:12px 0}.m:first-of-type{border:0}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}label{font-size:12px;color:var(--mute);display:block}
input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px inherit;font-family:inherit}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:7px 13px;font:14px inherit;font-family:inherit;margin:4px 6px 0 0}.chip[aria-pressed=true]{background:var(--r);border-color:var(--r);color:#fff}
.deck{position:relative;height:min(560px,68vh);margin:6px 0 18px;touch-action:pan-y}
.sw{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:var(--card);box-shadow:var(--sh);user-select:none;touch-action:pan-y;cursor:grab;transition:transform .3s,opacity .3s}
.sw .art{height:64%;display:flex;align-items:center;justify-content:center;font-size:150px;position:relative;overflow:hidden}
.sw .art::before,.sw .art::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.18)}.sw .art::before{width:340px;height:340px;top:-120px;left:-100px}.sw .art::after{width:240px;height:240px;bottom:-110px;right:-60px}
.sw .art span{position:relative;filter:drop-shadow(0 12px 14px rgba(0,0,0,.28))}
.sw .info{padding:16px 18px}.sw h3{margin:0 0 8px;font:800 24px/1.15 "Avenir Next","Segoe UI",system-ui,sans-serif;letter-spacing:-.4px}
.stamp{position:absolute;top:26px;font:900 28px inherit;font-family:inherit;border:4px solid;border-radius:12px;padding:2px 12px;opacity:0;letter-spacing:1px;background:rgba(255,255,255,.88)}.stamp.l{left:22px;color:var(--g);transform:rotate(-14deg)}.stamp.n{right:22px;color:var(--r);transform:rotate(14deg)}
.acts{display:flex;justify-content:center;gap:26px}.acts button{width:70px;height:70px;border-radius:50%;border:0;background:var(--card);font-size:30px;box-shadow:var(--sh)}.acts .n{color:var(--r)}.acts .l{color:#fff;background:linear-gradient(135deg,var(--g),var(--g2))}
.meal{display:flex;gap:12px;align-items:center;padding:8px 0}.meal em{font-style:normal;font-size:30px;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center}.meal small,.meal b{display:block}.meal small{color:var(--mute);font-size:13px}
.stat{display:flex;gap:10px;margin-bottom:14px}.stat div{flex:1;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);color:var(--mute);font-size:13px}.stat strong{display:block;font-size:26px;color:var(--g)}
@media(prefers-reduced-motion:reduce){.sw,.ln.new{transition:none;animation:none}}
</style></head><body><main>
<div class="top"><div class="logo"><i>J</i>Jedilnik</div><div class="dots" id="st"></div></div><div id="v"></div></main>
<script>
const items=[["Testenine","1 kg",365],["Riž","1 kg",365],["Krompir","2 kg",21],["Mleto meso","500 g",2],["Šunka","300 g",5],["Sir","400 g",14],["Jajca","10 kos",21],["Mleko","2 l",7],["Smetana","250 ml",7],["Moka","1 kg",180],["Zelenjava","800 g",5],["Paradižnikova omaka","700 g",365],["Kruh","1 kos",3],["Marmelada","1 kos",365]];
const D=[["Špageti z bolonjsko omako","🍝","#ff9a5a","#e8453c",30,["Testenine","Mleto meso","Paradižnikova omaka"]],["Pica z ostankom omake in sirom","🍕","#ffc94d","#f0701f",35,["Moka","Sir","Paradižnikova omaka"]],["Testenine s šunko in smetano","🥓","#ffd89a","#e48a5a",20,["Testenine","Šunka","Smetana"]],["Zapečene testenine s šunko in sirom","🧀","#ffe27a","#f2a02b",30,["Testenine","Šunka","Sir"]],["Riž z zelenjavo in jajcem na oko","🍳","#b5e86b","#3fae5a",25,["Riž","Zelenjava","Jajca"]],["Rižev narastek z jajci in sirom","🍚","#f7e8b8","#e0b341",40,["Riž","Jajca","Mleko","Sir"]],["Špageti s paradižnikovo omako","🍅","#ff8a7a","#d6303a",20,["Testenine","Paradižnikova omaka","Sir"]],["Opečen sendvič s šunko in sirom","🥪","#ffd27a","#c9772e",10,["Kruh","Šunka","Sir"]],["Pražen krompir z jajcem","🥔","#e9c98a","#b9803a",25,["Krompir","Jajca"]],["Omlet s krompirjem in sirom","🥚","#ffe9a0","#ef9f3a",20,["Jajca","Krompir","Sir"]],["Makaroni s sirom in smetano","🧀","#ffd25e","#e8892a",25,["Testenine","Sir","Smetana"]],["Zapečeni makaroni z zelenjavo","🥦","#a4e08a","#2f9a5b",35,["Testenine","Zelenjava","Jajca"]],["Pica z vso preostalo zelenjavo","🍕","#ffb36b","#d4452f",35,["Moka","Zelenjava","Sir"]],["Palačinke z marmelado","🥞","#ffc6a0","#c9553a",25,["Moka","Mleko","Jajca","Marmelada"]]];
const AL={gluten:/špageti|testenin|makaron|pica|sendvič|palačink/i,mleko:/sir|smetan|mleko|palačink|narastek/i,jajca:/jajc|omlet|palačink|narastek/i};
let step=1,scanned=0,idx=0,likes=[],fam=[{n:"Mama",a:38,w:68,h:168,al:[]},{n:"Oče",a:41,w:84,h:181,al:[]},{n:"Nika",a:10,w:34,h:140,al:["jajca"]},{n:"Luka",a:6,w:21,h:118,al:[]}];
const kcal=m=>Math.round((10*m.w+6.25*m.h-5*m.a-78)*1.4/10)*10,$=id=>document.getElementById(id),days=n=>items.find(x=>x[0]==n)[2];
function go(n){if(n>1&&scanned<items.length)scanned=items.length;step=n;draw()}
function scan(){scanned=0;draw();const t=setInterval(()=>{scanned++;draw(1);if(scanned>=items.length){clearInterval(t);draw()}},160)}
function warn(d){return fam.filter(m=>m.al.some(a=>AL[a].test(d[0]))).map(m=>m.n)}
function urg(d){const u=d[5].map(n=>[n,days(n)]).sort((a,b)=>a[1]-b[1])[0];return u[1]<=7?`<span class="tag y">Porabi ${u[0].toLowerCase()} (rok ~${u[1]} d)</span> `:""}
function card(d,i,top){const w=warn(d);return`<div class="sw" id="${top?'top':''}" style="z-index:${9-i};transform:scale(${1-i*.05}) translateY(${i*14}px);${top?'':'pointer-events:none'}"><div class="art" style="background:linear-gradient(150deg,${d[2]},${d[3]})"><span>${d[1]}</span></div><div class="stamp l">ZANIMA ME</div><div class="stamp n">NE</div><div class="info"><h3>${d[0]}</h3>${urg(d)}<span class="tag">${d[4]} min</span> ${w.length?`<span class="tag r">Pozor: ${w.join(", ")}</span>`:""}</div></div>`}
function draw(keep){$("st").innerHTML=[1,2,3,4].map(i=>`<b class="${step>=i?'on':''}"></b>`).join("");let h="";
if(step==1)h=`<h1>Fotkaš račun.<br>Dobiš jedilnik.</h1><p>Demo: račun je vzorčni, branje fotke je simulirano.</p><div class="card">${scanned?`<div class="receipt">${items.slice(0,scanned).map((x,i)=>`<div class="ln ${keep&&i==scanned-1?'new':''}"><span>${x[0]} ${x[1]}</span><span class="tag ${x[2]<=3?'r':x[2]<=7?'y':''}">~${x[2]>=100?'dolgo':x[2]+' d'}</span></div>`).join("")}</div><p style="margin:10px 0 0"><small>Rok je ocena po vrsti izdelka.</small></p>`:`<div class="receipt" style="text-align:center;padding:40px 10px">Tu se pokaže račun</div>`}<button class="btn" onclick="scan()">${scanned?'Slikaj znova':'Slikaj račun'}</button>${scanned>=items.length?'<button class="btn alt" onclick="go(2)">Naprej: družina</button>':''}</div>`;
if(step==2)h=`<h1>Kdo jé z vami?</h1><p>Iz starosti, teže in višine app oceni dnevno energijo.</p><div class="card">${fam.map((m,i)=>`<div class="m"><b>${m.n}</b> <span class="tag">${kcal(m)} kcal/dan</span><div class="row">${[["a","leta"],["w","kg"],["h","cm"]].map(([k,l])=>`<div><label for="${k}${i}">${l}</label><input id="${k}${i}" type="number" inputmode="numeric" value="${m[k]}" onchange="fam[${i}].${k}=+this.value;draw()"></div>`).join("")}</div>${Object.keys(AL).map(a=>`<button class="chip" aria-pressed="${m.al.includes(a)}" onclick="tg(${i},'${a}')">${a}</button>`).join("")}</div>`).join("")}<button class="btn" onclick="go(3)">Izberi jedi</button></div>`;
if(step==3){const rest=D.slice(idx);h=`<h1>${rest.length?'Kaj bi jedli?':'Izbrano!'}</h1><p>${rest.length?`Povleci desno za zanima me, levo za ne. ${idx}/${D.length}`:`Všečkal si ${likes.length} jedi.`}</p>${rest.length?`<div class="deck">${rest.slice(0,3).map((d,i)=>card(d,i,i==0)).reverse().join("")}</div><div class="acts"><button class="n" aria-label="Ne" onclick="fly(0)">✕</button><button class="l" aria-label="Zanima me" onclick="fly(1)">♥</button></div>`:`<button class="btn" onclick="go(4)">Pokaži moj teden</button><button class="btn alt" onclick="idx=0;likes=[];draw()">Začni znova</button>`}`}
if(step==4){const L=likes.map(i=>D[i]),used=new Set(L.flatMap(d=>d[5])),left=items.filter(x=>!used.has(x[0]));h=`<h1>Tvoj teden</h1><div class="stat"><div><strong>${used.size}/${items.length}</strong>izdelkov porabljenih</div><div><strong>${L.length}/14</strong>obrokov izbranih</div></div><div class="card">${[...Array(7)].map((_,i)=>`<div class="m"><b>Dan ${i+1}</b>${[0,1].map(j=>{const d=L[i*2+j];return d?`<div class="meal"><em style="background:linear-gradient(150deg,${d[2]},${d[3]})">${d[1]}</em><span><small>${j?'Večerja':'Kosilo'}</small><b>${d[0]}</b>${warn(d).length?`<span class="tag r">Pozor: ${warn(d).join(", ")}</span>`:""}</span></div>`:`<div class="meal"><em style="background:var(--line)">＋</em><span><small>${j?'Večerja':'Kosilo'}</small>Še prosto</span></div>`}).join("")}</div>`).join("")}</div>${left.length?`<div class="card"><h2>Ostane nepoporabljeno</h2><p>${left.map(x=>x[0]).join(", ")}. Izberi več jedi, da se porabi vse.</p></div>`:`<div class="card"><h2>Vse porabljeno</h2><p>Noben izdelek z računa ni brez jedi.</p></div>`}<small>App alergene le označi. Sestavine vedno preveri sam.</small><button class="btn alt" onclick="go(3);idx=0;likes=[];draw()">Izberi znova</button>`}
$("v").innerHTML=h;if(step==3&&idx<D.length)bind()}
function tg(i,a){const l=fam[i].al,k=l.indexOf(a);k<0?l.push(a):l.splice(k,1);draw()}
function stamp(e,dx){e.querySelector(".l").style.opacity=Math.max(0,dx/90);e.querySelector(".n").style.opacity=Math.max(0,-dx/90)}
function fly(like){const e=$("top");if(!e)return;e.style.transition="transform .35s,opacity .35s";e.style.transform=`translateX(${like?520:-520}px) rotate(${like?24:-24}deg)`;e.style.opacity=0;stamp(e,like?99:-99);if(like)likes.push(idx);setTimeout(()=>{idx++;draw()},300)}
function bind(){const e=$("top");let sx=0,dx=0,on=0;e.onpointerdown=ev=>{on=1;sx=ev.clientX;e.setPointerCapture(ev.pointerId);e.style.transition="none"};e.onpointermove=ev=>{if(!on)return;dx=ev.clientX-sx;e.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;stamp(e,dx)};e.onpointerup=()=>{on=0;if(Math.abs(dx)>90)fly(dx>0);else{e.style.transition="transform .25s";e.style.transform="";stamp(e,0)}dx=0}}
document.addEventListener("keydown",e=>{if(step==3&&idx<D.length){if(e.key=="ArrowRight")fly(1);if(e.key=="ArrowLeft")fly(0)}});
draw();
</script></body></html>
